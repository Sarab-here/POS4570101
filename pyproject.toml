[project]
name = "serveu-backend"
version = "0.1.0"
description = "ServeU backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend"]
