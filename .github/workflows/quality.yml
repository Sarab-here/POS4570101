name: Quality and security

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@12.1.0

      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.1.0"

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Check formatting
        run: npm --prefix frontend run format:check

      - name: Type-check
        run: npm --prefix frontend run typecheck

      - name: Test
        run: npm --prefix frontend run test

      - name: Build scaffold
        run: npm --prefix frontend run build

      - name: Audit npm dependencies
        run: npm audit --prefix frontend --audit-level=high

  backend:
    name: Backend quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pinned Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          python-version: 3.14.7
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify runtime pins
        run: |
          test "$(python --version)" = "Python 3.14.7"
          test "$(uv --version)" = "uv 0.12.19"

      - name: Install locked backend dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check backend

      - name: Ruff format check
        run: uv run --frozen ruff format --check backend

      - name: Type-check
        run: uv run --frozen mypy backend

      - name: Test
        run: uv run --frozen pytest

      - name: Audit Python dependencies
        run: uv run --frozen pip-audit --local

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          install_dir="$RUNNER_TEMP/gitleaks"
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          test "$("$install_dir/gitleaks" version)" = "$version"

      - name: Scan complete checked-out repository
        run: gitleaks dir --config gitleaks.toml --redact=100 --no-banner .

      - name: Scan all refs and full Git history
        run: gitleaks git --config gitleaks.toml --redact=100 --no-banner .
