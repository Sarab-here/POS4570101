name: Quality and security

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@12.1.0

      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.1.0"

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Check formatting
        run: npm --prefix frontend run format:check

      - name: Type-check
        run: npm --prefix frontend run typecheck

      - name: Test
        run: npm --prefix frontend run test

      - name: Build scaffold
        run: npm --prefix frontend run build

      - name: Audit npm dependencies
        run: npm audit --prefix frontend --audit-level=high

  backend:
    name: Backend quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pinned Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Capture setup-python interpreter path
        id: setup-python-interpreter
        shell: bash
        run: printf 'path=%s\n' "$(which python)" >> "$GITHUB_OUTPUT"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          python-version: 3.14.7
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Compare setup-python interpreter path
        shell: bash
        env:
          SETUP_PYTHON_PATH: ${{ steps.setup-python-interpreter.outputs.path }}
        run: |
          current_python_path="$(which python)"
          printf 'setup-python interpreter path: %s\n' "$SETUP_PYTHON_PATH"
          printf 'current python interpreter path: %s\n' "$current_python_path"

          {
            printf -- '- `setup-python` interpreter path: `%s`\n' "$SETUP_PYTHON_PATH"
            printf -- '- current `python` interpreter path: `%s`\n' "$current_python_path"
          } >> "$GITHUB_STEP_SUMMARY"

          setup_python_realpath="$(readlink -f "$SETUP_PYTHON_PATH")"
          current_python_realpath="$(readlink -f "$current_python_path")"
          if [[ "$current_python_realpath" == "$setup_python_realpath" ]]; then
            echo "python resolves to the interpreter selected by setup-python."
          else
            echo "::warning::python resolves to a different interpreter than the one selected by setup-python."
          fi

      - name: Verify runtime pins
        shell: bash
        run: |
          set -euo pipefail

          python_version="$(python --version 2>&1)"
          uv_version_output="$(uv --version 2>&1)"
          uv_version_token="$(awk 'NR == 1 { print $2; exit }' <<< "$uv_version_output")"

          echo "$python_version"
          echo "$uv_version_output"

          {
            echo '### Backend runtime pin verification'
            printf -- '- Python version: `%s`\n' "$python_version"
            printf -- '- uv version output: `%s`\n' "$uv_version_output"
            printf -- '- uv version token 2: `%s`\n' "$uv_version_token"
          } >> "$GITHUB_STEP_SUMMARY"

          runtime_pin_failed=0
          test "$python_version" = "Python 3.14.7" || {
            echo "::error::Expected Python 3.14.7, found: $python_version"
            runtime_pin_failed=1
          }
          test "$uv_version_token" = "0.12.19" || {
            echo "::error::Expected uv version token 2 to be 0.12.19, found: $uv_version_token"
            runtime_pin_failed=1
          }
          exit "$runtime_pin_failed"

      - name: Install locked backend dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check backend

      - name: Ruff format check
        run: uv run --frozen ruff format --check backend

      - name: Type-check
        run: uv run --frozen mypy backend

      - name: Test
        run: uv run --frozen pytest

      - name: Audit Python dependencies
        run: uv run --frozen pip-audit --local

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          install_dir="$RUNNER_TEMP/gitleaks"
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          test "$("$install_dir/gitleaks" version)" = "$version"

      - name: Scan complete checked-out repository
        run: gitleaks dir --config gitleaks.toml --redact=100 --no-banner .

      - name: Scan all refs and full Git history
        run: gitleaks git --config gitleaks.toml --redact=100 --no-banner .
